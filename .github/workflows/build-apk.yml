# RangBharo — build SIGNED RELEASE APK on every push.
# One permanent release keystore (GitHub secrets KEYSTORE_BASE64 /
# KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD) signs every build, so
# updates install over the previous version without uninstall.
# versionCode is the GitHub run number, so it always increases.
name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor
        run: npm install @capacitor/cli @capacitor/core @capacitor/android typescript @capacitor/local-notifications

      - name: Stamp app version (version-check)
        # The in-app version check compares APP_VERSION (this build's
        # run number = versionCode) against www/version.json's
        # "latest". The repo file keeps the placeholder so node
        # --check still passes and website previews never prompt.
        # This step runs on the CI checkout copy only and fails
        # loudly if the placeholder is missing or not replaced.
        run: |
          if ! grep -q '"__APP_VERSION__"' www/index.html; then
            echo "ERROR: APP_VERSION placeholder not found in www/index.html"
            exit 1
          fi
          sed -i "s/\"__APP_VERSION__\"/${{ github.run_number }}/g" www/index.html
          if grep -q '__APP_VERSION__' www/index.html; then
            echo "ERROR: APP_VERSION placeholder was not fully replaced"
            exit 1
          fi
          if ! grep -q "APP_VERSION = ${{ github.run_number }}" www/index.html; then
            echo "ERROR: stamped APP_VERSION not found in www/index.html"
            exit 1
          fi
          echo "APP_VERSION stamped to ${{ github.run_number }}"

      - name: Add Android platform (first run only)
        run: |
          rm -f capacitor.config.ts
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Raise minSdk to 26 (Unity Ads plugin needs 26)
        # The Unity Ads plugin declares minSdkVersion 26; the generated
        # app project resolves to 22, and the manifest merger fails the
        # build ("uses-sdk:minSdkVersion 22 cannot be smaller than
        # version 26"). Android 8.0+ (API 26) covers ~all active phones.
        run: |
          python3 - << 'EOF'
          import pathlib, re, sys
          patched = []
          for fname in ('android/variables.gradle', 'android/app/build.gradle'):
              p = pathlib.Path(fname)
              if not p.exists():
                  continue
              t = p.read_text()
              t2, n1 = re.subn(r'minSdkVersion\s*=\s*\d+', 'minSdkVersion = 26', t)
              t2, n2 = re.subn(r'minSdkVersion\s+\d+', 'minSdkVersion 26', t2)
              t2, n3 = re.subn(r'\bminSdk\s*=\s*\d+', 'minSdk = 26', t2)
              t2, n4 = re.subn(r'\bminSdk\s+\d+', 'minSdk 26', t2)
              if n1 + n2 + n3 + n4:
                  p.write_text(t2)
                  patched.append((fname, n1 + n2 + n3 + n4))
          if not patched:
              print('ERROR: no minSdk line found to raise in android project')
              sys.exit(1)
          for f, n in patched:
              print('raised minSdk to 26 in', f, '(%d replacement%s)' % (n, 's' if n > 1 else ''))
          EOF

      - name: Verify Unity Ads wiring
        # Fail loudly if the Unity plugin did not register with
        # Capacitor, or an old ad-network ID is still in the shipped
        # code. Unity needs no manifest meta-data: the Game ID is
        # passed to UnityAds.initialize() at runtime from JS.
        run: |
          python3 - << 'EOF'
          import json, pathlib, sys
          fails = []
          plug = pathlib.Path('android/app/src/main/assets/capacitor.plugins.json')
          if not plug.exists():
              fails.append('capacitor.plugins.json missing (did cap sync run?)')
          elif 'UnityAds' not in plug.read_text():
              fails.append('UnityAds plugin not registered in capacitor.plugins.json')
          www = pathlib.Path('www/index.html').read_text()
          for bad in ('ca-app-pub', '3940256099942544'):
              if bad in www:
                  fails.append('forbidden string in www/index.html: ' + bad)
          if 'admob' in www.lower():
              fails.append('AdMob reference still in www/index.html')
          for good in ('800457125', 'BP_Rewarded_Android', 'BP_Interstitial_Android', 'BP_Banner_Android'):
              if good not in www:
                  fails.append('missing Unity ID in www/index.html: ' + good)
          if fails:
              print('UNITY ADS CHECK FAILED:')
              for f in fails:
                  print(' -', f)
              sys.exit(1)
          print('Unity Ads wiring OK: plugin registered, Game ID + 3 placements present, no old-network IDs')
          EOF

      - name: Apply custom app icon
        run: |
          python3 -m pip install -q pillow
          python3 - << 'EOF'
          from PIL import Image
          import pathlib
          src = Image.open('www/icon.png').convert('RGBA')
          # Safe-zone icon: art covers 60% of the canvas on a transparent
          # background. A full-bleed square loses 21.5% of its pixels to a
          # circle mask (corners + edges cut off); at 60% the whole art
          # stays visible under circle and squircle masks. Build one
          # 432px master (adaptive-foreground size) with LANCZOS and
          # derive every density from it, so the foreground is never an
          # upscaled 192px image (that blur was the low-quality look).
          PAD = 0.60
          master = Image.new('RGBA', (432, 432), (0, 0, 0, 0))
          side = int(432 * PAD)
          art = src.resize((side, side), Image.LANCZOS)
          master.paste(art, ((432 - side) // 2, (432 - side) // 2))
          sizes = {'mipmap-mdpi': 48, 'mipmap-hdpi': 72, 'mipmap-xhdpi': 96, 'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192}
          base = pathlib.Path('android/app/src/main/res')
          for folder, size in sizes.items():
              d = base / folder
              if not d.exists():
                  continue
              img = master.resize((size, size), Image.LANCZOS)
              for name in ('ic_launcher.png', 'ic_launcher_round.png'):
                  p = d / name
                  if p.exists():
                      img.save(p)
                      print('replaced', p)
              # Adaptive foreground is 2.25x the legacy size
              # (108/162/216/324/432): generate it at its native size
              # from the master, never upscaled from a small image.
              fg_size = size * 9 // 4
              fg = master.resize((fg_size, fg_size), Image.LANCZOS)
              p = d / 'ic_launcher_foreground.png'
              if p.exists():
                  fg.save(p)
                  print('replaced', p)
          EOF

      # Notification icons: white-silhouette small icon + full-colour large icon.
      # Without these, Android falls back to the launcher icon as the small icon
      # and shows the white-circle "!" placeholder. Files live in the repo at
      # notif-icons/ (flat names: ic_stat_icon__<density>.png).
      - name: Add notification icons
        run: |
          set -e
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/drawable-$d"
            cp "notif-icons/ic_stat_icon__$d.png" "android/app/src/main/res/drawable-$d/ic_stat_icon.png"
            cp "notif-icons/ic_notif_large__$d.png" "android/app/src/main/res/drawable-$d/ic_notif_large.png"
          done
          mkdir -p android/app/src/main/res/drawable
          cp notif-icons/ic_stat_icon__nodpi.png android/app/src/main/res/drawable/ic_stat_icon.png
          cp notif-icons/ic_notif_large__nodpi.png android/app/src/main/res/drawable/ic_notif_large.png
          ls android/app/src/main/res/drawable-*/ic_stat_icon.png android/app/src/main/res/drawable-*/ic_notif_large.png
      - name: Configure release signing
        # Same keystore for every build -> same certificate -> Android
        # accepts the new APK as an update over the old one.
        # The keystore itself lives ONLY in GitHub secrets; no secret
        # value appears anywhere in this file.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: GitHub secret KEYSTORE_BASE64 is not set for this repo."
            echo "Add secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD"
            echo "in repo Settings > Secrets and variables > Actions, then re-run this workflow."
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: one of KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD is not set."
            exit 1
          fi
          echo "KEYSTORE_BASE64 length: ${#KEYSTORE_BASE64} chars (expect 3568)"
          for i in 0 1 2 3; do off=$((i*892)); part="${KEYSTORE_BASE64:$off:892}"; echo "chunk$((i+1)) len: ${#part} md5: $(printf '%s' "$part" | md5sum | cut -d' ' -f1)"; done
          echo "joined sha256: $(printf '%s' "$KEYSTORE_BASE64" | sha256sum | cut -d' ' -f1)"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android/app/release.keystore
          if [ ! -s android/app/release.keystore ]; then echo "ERROR: decoded keystore is empty"; exit 1; fi
          ls -l android/app/release.keystore
          python3 - << 'EOF'
          import os, re, pathlib
          p = pathlib.Path('android/app/build.gradle')
          s = p.read_text()
          run_number = os.environ['GITHUB_RUN_NUMBER']
          # 1. signingConfigs.release right after "android {"
          if 'signingConfigs' not in s:
              block = (
                  '    signingConfigs {\n'
                  '        release {\n'
                  '            storeFile file("release.keystore")\n'
                  '            storePassword System.getenv("KEYSTORE_PASSWORD")\n'
                  '            keyAlias System.getenv("KEY_ALIAS")\n'
                  '            keyPassword System.getenv("KEY_PASSWORD")\n'
                  '        }\n'
                  '    }\n'
              )
              s, n = re.subn(r'(?m)^([ \t]*android[ \t]*\{[ \t]*)$', r'\1\n' + block, s, count=1)
              assert n == 1, 'android { block not found'
          # 2. versionCode = run number (must always increase for updates)
          s, n = re.subn(r'versionCode\s+\d+', 'versionCode ' + run_number, s, count=1)
          assert n == 1, 'versionCode not found'
          # 3. versionName stays 1.0
          s, n = re.subn(r'versionName\s+"[^"]*"', 'versionName "1.0"', s, count=1)
          assert n == 1, 'versionName not found'
          # 4. wire the release build type to the signing config
          if 'signingConfig signingConfigs.release' not in s:
              m = re.search(r'(?m)^(.*buildTypes[ \t]*\{[ \t]*)$', s)
              assert m, 'buildTypes block not found'
              m2 = re.search(r'(?m)^([ \t]*)release[ \t]*\{[ \t]*$', s[m.end():])
              assert m2, 'release block not found'
              indent = m2.group(1) + '    '
              pos = m.end() + m2.end()
              s = s[:pos] + '\n' + indent + 'signingConfig signingConfigs.release' + s[pos:]
          p.write_text(s)
          print('release signing configured, versionCode =', run_number)
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: rangbharo-debug-apk
          path: android/app/build/outputs/apk/release/app-release.apk
