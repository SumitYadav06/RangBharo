# RangBharo — build debug APK on every push (no signing, no keystore needed).
# Debug APK is enough for Uptodown testing; signed release comes later.
name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor
        run: npm install @capacitor/cli @capacitor/core @capacitor/android typescript

      - name: Add Android platform (first run only)
        run: |
          rm -f capacitor.config.ts
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rangbharo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
