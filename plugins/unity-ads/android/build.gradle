apply plugin: 'com.android.library'

android {
    namespace 'com.dripply.unityads'
    compileSdk 34
    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    api project(':capacitor-android')
    // Capacitor's Plugin.getActivity() returns AppCompatActivity, so the
    // plugin module needs appcompat on its own compile classpath
    // (capacitor-android does not expose it transitively). Without this,
    // :dripply-unity-ads:compileReleaseJavaWithJavac fails with
    // "cannot access AppCompatActivity" (Dripply run #20).
    api 'androidx.appcompat:appcompat:1.7.0'
    // Unity Ads Android SDK 4.x (docs.unity.com, SDK 4.18.0 API).
    implementation 'com.unity3d.ads:unity-ads:4.18.0'
}
